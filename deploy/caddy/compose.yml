name: justours

services:
  caddy:
    image: justours/caddy:2.11.4-ratelimit
    build:
      context: .
      args:
        CADDY_VERSION: 2.11.4
        CADDY_RATELIMIT_COMMIT: 5625512f24f6f59d6f64fb3aafe5eecff0b286db
    container_name: caddy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:mode=1777
    networks:
      - app
      - apps
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: "8"

volumes:
  caddy_data:
  caddy_config:

networks:
  app:
    external: true
    name: ${APP_NETWORK:-justours-app_public}
  apps:
    external: true
    name: ${APPS_NETWORK:-justours-edge}
